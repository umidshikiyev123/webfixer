<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CaspAI — Fakt Yoxlayıcı</title>
<meta name="description" content="CaspAI: iddianı yazın, süni intellekt onu internetdə yoxlasın və mənbələri göstərsin.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#09090f; --panel:#12121d; --panel2:#181827; --ink:#f1f1ff; --muted:#9a9ab8;
  --purple:#a855f7; --cyan:#22d3ee; --lime:#a3e635; --amber:#fbbf24; --danger:#fb7185;
  --line:#2c2c44; --bw:3px; --r:10px;
  --font:'Space Grotesk',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:var(--font);background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.55;
  background-image:
    radial-gradient(circle at 15% 0%,rgba(168,85,247,.18),transparent 40%),
    radial-gradient(circle at 90% 20%,rgba(34,211,238,.12),transparent 40%),
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:auto,auto,36px 36px,36px 36px;background-attachment:fixed;
}
a{color:var(--cyan)}
header{border-bottom:var(--bw) solid var(--purple);background:rgba(9,9,15,.88)}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}
.head-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.4rem;color:var(--ink);text-decoration:none}
.logo i{font-style:normal;display:grid;place-items:center;width:40px;height:40px;background:var(--purple);border:var(--bw) solid var(--ink);border-radius:8px;box-shadow:3px 3px 0 var(--cyan)}
.logo b{color:var(--cyan)}
.back{font-size:.9rem;color:var(--muted);text-decoration:none}
.back:hover{color:var(--cyan)}
.hero{margin:28px 0 20px;padding:24px 22px;background:var(--panel);border:var(--bw) solid var(--ink);border-radius:14px;box-shadow:8px 8px 0 var(--purple)}
.hero h1{font-size:clamp(1.5rem,4vw,2.3rem);line-height:1.15;letter-spacing:-1px}
.hero h1 em{font-style:normal;color:var(--cyan);text-shadow:0 0 18px rgba(34,211,238,.6)}
.hero p{color:var(--muted);margin-top:8px}
.panel{background:var(--panel);border:var(--bw) solid var(--ink);border-radius:14px;padding:22px;box-shadow:8px 8px 0 var(--cyan)}
label{display:block;font-size:.82rem;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
textarea{width:100%;min-height:120px;resize:vertical;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:8px;padding:12px;font-family:var(--mono);font-size:.95rem;outline:none}
textarea:focus{border-color:var(--purple);box-shadow:3px 3px 0 var(--purple)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.count{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.btn{cursor:pointer;background:var(--purple);color:#fff;font-family:inherit;font-size:1rem;font-weight:700;border:var(--bw) solid var(--ink);border-radius:8px;padding:10px 20px;box-shadow:4px 4px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn:disabled{opacity:.6;cursor:wait;transform:none;box-shadow:4px 4px 0 var(--ink)}
.examples{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.chip{cursor:pointer;font-family:inherit;color:var(--ink);background:var(--panel2);border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.85rem}
.chip:hover{border-color:var(--purple)}
#result{margin-top:22px}
.card{background:var(--panel);border:var(--bw) solid var(--line);border-radius:12px;padding:18px}
.badge{display:inline-block;font-family:var(--mono);font-weight:700;font-size:.85rem;padding:5px 12px;border-radius:6px;border:2px solid;margin-bottom:10px}
.v-DOGRUDUR{color:var(--lime);border-color:var(--lime)}
.v-YANLISDIR{color:var(--danger);border-color:var(--danger)}
.v-QISMEN{color:var(--amber);border-color:var(--amber)}
.v-YOXLANA_BILMEDI{color:var(--muted);border-color:var(--muted)}
.card p{color:#d4d4ec}
.card h3{margin:16px 0 6px;font-size:1rem;color:var(--cyan)}
.card ul{padding-left:20px}
.card li{margin-bottom:4px;word-break:break-word}
.err{border-color:var(--danger);color:var(--danger)}
.note{margin:22px 0 40px;color:var(--muted);font-size:.85rem}
.spin{display:inline-block;width:14px;height:14px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <div class="wrap head-row">
    <a class="logo" href="./"><i>🔎</i><span>Casp<b>AI</b></span></a>
    <a class="back" href="/">← MikroTools</a>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h1>İddianı yaz. <em>Yoxlayaq.</em></h1>
    <p>CaspAI iddianı internetdə axtarır, nəticəni izah edir və mənbələri göstərir.</p>
  </section>

  <section class="panel">
    <label for="claim">İddia və ya xəbər</label>
    <textarea id="claim" maxlength="600" placeholder="məs: Xəzər dənizi dünyanın ən böyük gölüdür"></textarea>
    <div class="row">
      <span class="count" id="count">0 / 600</span>
      <button class="btn" id="go">Yoxla</button>
    </div>
    <div class="examples">
      <button class="chip" type="button">Xəzər dənizi dünyanın ən böyük gölüdür</button>
      <button class="chip" type="button">İnsanlar beyinlərinin yalnız 10%-ni istifadə edir</button>
    </div>
  </section>

  <div id="result" aria-live="polite"></div>

  <p class="note">CaspAI süni intellektdən istifadə edir və səhv edə bilər. Vacib məsələlərdə mənbələrə özünüz baxın.</p>
</main>

<script>
// Cloudflare Worker ünvanı (sonda /check ilə)
const WORKER_URL = 'https://cold-glitter-c4a0.denemeclaude490.workers.dev/check';

const LABELS = {
  DOGRUDUR: '✓ DOĞRUDUR',
  YANLISDIR: '✗ YANLIŞDIR',
  QISMEN: '≈ QISMƏN DOĞRUDUR',
  YOXLANA_BILMEDI: '? YOXLANA BİLMƏDİ'
};

const $ = s => document.querySelector(s);
const claim = $('#claim'), go = $('#go'), out = $('#result');

claim.addEventListener('input', () => { $('#count').textContent = claim.value.length + ' / 600'; });
document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
  claim.value = c.textContent; claim.dispatchEvent(new Event('input')); claim.focus();
}));

function showError(msg) {
  out.innerHTML = '';
  const d = document.createElement('div'); d.className = 'card err'; d.textContent = msg;
  out.appendChild(d);
}

function showResult(r) {
  out.innerHTML = '';
  const card = document.createElement('div'); card.className = 'card';
  const b = document.createElement('span');
  const v = LABELS[r.verdict] ? r.verdict : 'YOXLANA_BILMEDI';
  b.className = 'badge v-' + v; b.textContent = LABELS[v];
  const p = document.createElement('p'); p.textContent = r.summary || '';
  card.append(b, p);
  const list = (r.sources || []).filter(s => /^https?:\/\//.test(s.url));
  if (list.length) {
    const h = document.createElement('h3'); h.textContent = 'Mənbələr';
    const ul = document.createElement('ul');
    list.forEach(s => {
      const li = document.createElement('li'), a = document.createElement('a');
      a.href = s.url; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.textContent = s.title || s.url;
      li.appendChild(a); ul.appendChild(li);
    });
    card.append(h, ul);
  }
  out.appendChild(card);
}

go.addEventListener('click', async () => {
  const text = claim.value.trim();
  if (text.length < 5) { showError('İddia çox qısadır. Ən azı bir cümlə yazın.'); return; }
  go.disabled = true; go.innerHTML = '<span class="spin"></span>Yoxlanılır...';
  out.innerHTML = '';
  try {
    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ claim: text })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) { showError(data.error || ('Xəta: ' + res.status)); }
    else { showResult(data); }
  } catch (e) {
    showError('Serverə qoşulmaq olmadı. İnterneti yoxlayın və yenidən cəhd edin.');
  } finally {
    go.disabled = false; go.textContent = 'Yoxla';
  }
});
</script>
</body>
</html>
