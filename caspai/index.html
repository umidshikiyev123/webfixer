<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CaspAI — Süni İntellekt Dostun | WebFixer</title>
<meta name="description" content="CaspAI ilə danış: idman məşq proqramından dərs izahına, gündəlik sadə suallara qədər — səmimi süni intellekt köməkçin.">
<meta name="theme-color" content="#0b2a5b">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://webfixer.space/caspai/">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" href="/assets/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/source-serif-4-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/style.css">
<link rel="stylesheet" href="/assets/caspai.css">
<script>document.documentElement.className+=' js'</script>
<script>try{var t=localStorage.getItem('wf-theme');if(!t&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)t='dark';if(t==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
</head>
<body class="cai-body">

<div class="cai-app">
  <div class="cai-bar">
    <div class="cai-bar-in">
      <a class="cai-back" href="/">← WebFixer</a>
      <div class="cai-logo">Casp<b>AI</b></div>
      <div class="cai-left" id="remain" hidden></div>
    </div>
  </div>

  <div class="cai-log" id="log">
    <div class="cai-drop" id="drop"><div class="cai-drop-in">Şəkli buraya burax</div></div>
    <div class="cai-log-in" id="logIn">
      <div class="cai-msg ai">Salam! Mən CaspAI-yam 👋 İdman/məşq proqramından dərs izahına, gündəlik sadə suallara qədər — nə lazımdırsa soruş, danışaq.</div>
      <div class="cai-sugg" id="sugg">
        <button type="button" data-q="Başlanğıc səviyyə üçün evdə edilə bilən 3 günlük məşq proqramı ver">Ev məşq proqramı ver</button>
        <button type="button" data-q="Pifaqor teoremini sadə, nümunə ilə izah et">Pifaqor teoremini izah et</button>
        <button type="button" data-q="200 qram pendirdə təxminən neçə qram protein olur?">200q pendirdə protein nə qədərdir?</button>
      </div>
    </div>
  </div>

  <div class="cai-foot">
    <div class="cai-foot-in">
      <div class="cai-preview" id="imgPreview" hidden>
        <img id="imgPreviewImg" alt="Seçilmiş şəkil">
        <button type="button" id="imgRemove" aria-label="Şəkli sil">✕</button>
      </div>
      <form class="cai-form" id="form">
        <input type="file" id="imgInput" accept="image/png,image/jpeg,image/webp,image/heic,image/heif" hidden>
        <button class="cai-attach" id="attach" type="button" aria-label="Şəkil əlavə et">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05 12.25 20.24a5 5 0 0 1-7.07-7.07l8.49-8.49a3.5 3.5 0 0 1 4.95 4.95L9.17 18.17a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        </button>
        <textarea id="input" maxlength="500" rows="1" placeholder="Mesaj yaz..." aria-label="Mesaj"></textarea>
        <button class="cai-send" id="send" type="submit" aria-label="Göndər">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4Z"/></svg>
        </button>
      </form>
      <p class="cai-note">CaspAI süni intellektdən istifadə edir və səhv edə bilər. Tibbi, hüquqi və maliyyə qərarlarında mütəxəssisə müraciət edin.</p>
    </div>
  </div>
</div>

<script>
const WORKER_BASE = 'https://cold-glitter-c4a0.denemeclaude490.workers.dev';
const $ = s => document.querySelector(s);
const log = $('#log'), logIn = $('#logIn'), form = $('#form'), input = $('#input'), send = $('#send'), sugg = $('#sugg'), remainEl = $('#remain');

let history = []; // {role:'user'|'assistant', content}
let busy = false;
let pendingImage = null; // {mimeType, data} — base64 (prefiksiz)

const ALLOWED_IMAGE_TYPES = ['image/png', 'image/jpeg', 'image/webp', 'image/heic', 'image/heif'];
const MAX_IMAGE_BYTES = 4 * 1024 * 1024;
const attachBtn = $('#attach'), imgInput = $('#imgInput'), imgPreview = $('#imgPreview'), imgPreviewImg = $('#imgPreviewImg'), imgRemove = $('#imgRemove'), drop = $('#drop');

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// **qalın** -> <strong>, sətirlər qorunur (CSS: white-space:pre-wrap)
function formatReply(text) {
  return escapeHtml(text).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}

function scrollDown() {
  log.scrollTop = log.scrollHeight;
}

function addMsg(role, text, extraClass) {
  const d = document.createElement('div');
  d.className = 'cai-msg ' + (role === 'user' ? 'me' : 'ai') + (extraClass ? ' ' + extraClass : '');
  if (role === 'user') d.textContent = text; else d.innerHTML = formatReply(text);
  logIn.appendChild(d);
  scrollDown();
  return d;
}

function setBusy(b) {
  busy = b;
  send.disabled = b;
  input.disabled = b;
  attachBtn.disabled = b;
}

function autoResize() {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 140) + 'px';
}
input.addEventListener('input', autoResize);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});

sugg.addEventListener('click', e => {
  const b = e.target.closest('button[data-q]');
  if (!b || busy) return;
  input.value = b.dataset.q;
  form.requestSubmit();
});

function hideSugg() { sugg.hidden = true; }

function showRemain(n) {
  if (n == null) return;
  remainEl.hidden = false;
  remainEl.textContent = n > 0 ? `Bu gün: ${n} mesaj qaldı` : 'Bu günlük limit bitdi';
  remainEl.classList.toggle('zero', n <= 0);
}

function setImageError(msg) {
  const b = addMsg('ai', msg, 'err');
  return b;
}

function fileToImage(file) {
  if (!file) return;
  if (!ALLOWED_IMAGE_TYPES.includes(file.type)) {
    setImageError('Dəstəklənməyən şəkil formatı. PNG, JPG, WEBP və ya HEIC istifadə edin.');
    return;
  }
  if (file.size > MAX_IMAGE_BYTES) {
    setImageError('Şəkil çox böyükdür (maks. ~4MB). Daha kiçik şəkil göndərin.');
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    const dataUrl = reader.result;
    const base64 = String(dataUrl).split(',')[1] || '';
    pendingImage = { mimeType: file.type, data: base64 };
    imgPreviewImg.src = dataUrl;
    imgPreview.hidden = false;
  };
  reader.onerror = () => setImageError('Şəkil oxuna bilmədi. Yenidən sınayın.');
  reader.readAsDataURL(file);
}

function clearImage() {
  pendingImage = null;
  imgPreview.hidden = true;
  imgPreviewImg.src = '';
  imgInput.value = '';
}

attachBtn.addEventListener('click', () => { if (!busy) imgInput.click(); });
imgInput.addEventListener('change', () => {
  const file = imgInput.files && imgInput.files[0];
  fileToImage(file);
});
imgRemove.addEventListener('click', clearImage);

// sürükləyib-burax: bütün chat sahəsi üzərində
['dragenter', 'dragover'].forEach(ev => {
  log.addEventListener(ev, e => {
    if (busy) return;
    e.preventDefault();
    drop.classList.add('show');
  });
});
['dragleave', 'drop'].forEach(ev => {
  log.addEventListener(ev, e => {
    e.preventDefault();
    if (ev === 'drop') return;
    if (e.target === log || e.target === drop || !log.contains(e.relatedTarget)) drop.classList.remove('show');
  });
});
log.addEventListener('drop', e => {
  e.preventDefault();
  drop.classList.remove('show');
  if (busy) return;
  const file = e.dataTransfer.files && e.dataTransfer.files[0];
  if (file) fileToImage(file);
});

async function loadStatus() {
  try {
    const res = await fetch(WORKER_BASE + '/status');
    const data = await res.json().catch(() => null);
    if (data && typeof data.remaining === 'number') showRemain(data.remaining);
  } catch (e) { /* səssiz keç, status göstərici dekorativdir */ }
}
loadStatus();

// Axını sətir-sətir oxuyub, hər "data: {...}\n\n" paketini parçalayır
async function* readSSE(res) {
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    let idx;
    while ((idx = buffer.indexOf('\n\n')) !== -1) {
      const rawEvent = buffer.slice(0, idx);
      buffer = buffer.slice(idx + 2);
      const line = rawEvent.split('\n').find(l => l.startsWith('data:'));
      if (!line) continue;
      const jsonStr = line.slice(5).trim();
      if (!jsonStr) continue;
      try { yield JSON.parse(jsonStr); } catch { /* keç */ }
    }
  }
}

form.addEventListener('submit', async e => {
  e.preventDefault();
  if (busy) return;
  const text = input.value.trim();
  const image = pendingImage;
  if (!text && !image) return;

  hideSugg();
  if (image) {
    const d = document.createElement('div');
    d.className = 'cai-msg me cai-msg-img';
    if (text) {
      const p = document.createElement('div');
      p.textContent = text;
      d.appendChild(p);
    }
    const im = document.createElement('img');
    im.src = imgPreviewImg.src;
    d.appendChild(im);
    logIn.appendChild(d);
    scrollDown();
  } else {
    addMsg('user', text);
  }
  history.push({ role: 'user', content: text || '(şəkil göndərildi)' });
  input.value = '';
  clearImage();
  autoResize();
  setBusy(true);
  const bubble = addMsg('ai', 'CaspAI yazır…', 'wait');
  let started = false; // ilk mətn parçası gələndə "yazır…" görünüşünü aradan qaldırır
  let fullText = '';

  try {
    const res = await fetch(WORKER_BASE + '/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history.slice(-12), image: image || undefined }),
    });

    if (!res.ok || !res.body) {
      const data = await res.json().catch(() => ({}));
      bubble.classList.remove('wait');
      bubble.classList.add('err');
      bubble.textContent = data.error || ('Xəta: ' + res.status);
      if (typeof data.remaining === 'number') showRemain(data.remaining);
      return;
    }

    let remaining = null, gotError = null;
    for await (const ev of readSSE(res)) {
      if (ev.delta) {
        if (!started) { started = true; bubble.classList.remove('wait'); }
        fullText += ev.delta;
        bubble.innerHTML = formatReply(fullText) + '<span class="cai-caret"></span>';
        scrollDown();
      }
      if (ev.error) gotError = ev.error;
      if (typeof ev.remaining === 'number') remaining = ev.remaining;
    }

    bubble.classList.remove('wait');
    if (gotError && !fullText) {
      bubble.classList.add('err');
      bubble.textContent = gotError;
    } else {
      bubble.innerHTML = formatReply(fullText || '...');
      if (fullText) history.push({ role: 'assistant', content: fullText });
    }
    if (remaining != null) showRemain(remaining);
  } catch (err) {
    bubble.classList.remove('wait');
    bubble.classList.add('err');
    bubble.textContent = fullText
      ? 'Bağlantı kəsildi, cavab yarımçıq qala bilər.'
      : 'Serverə qoşulmaq olmadı. İnternet bağlantınızı yoxlayıb yenidən yazın.';
  } finally {
    setBusy(false);
    input.focus();
  }
});
</script>
</body>
</html>
