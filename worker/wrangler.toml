name = "caspai"
main = "worker.js"
compatibility_date = "2025-01-01"

[vars]
# Gemini modeli. Köhnə gemini-2.5-flash-lite yeni hesablar üçün bağlanıb.
# Dəqiq adları yoxlamaq üçün Google AI Studio-dakı model siyahısına bax.
MODEL = "gemini-3.1-flash-lite"
DAILY_PER_IP = "5"      # hər istifadəçiyə günlük pulsuz mesaj
DAILY_GLOBAL = "450"    # bütün sayt üçün günlük tavan. Google pulsuz səviyyə: 500/gün, 50 ehtiyat qalır
RPM_MAX = "12"          # dəqiqədə maksimum sorğu. Google pulsuz səviyyə: 15/dəq, 3 ehtiyat qalır
AI_ENABLED = "true"     # kill switch: "false" yazıb deploy etsən, AI dərhal söndürülür
MAX_OUTPUT = "600"      # cavabın maksimum token sayı
# EXTRA_ORIGIN = "http://localhost:8080"   # yalnız yerli test üçün, sonra sil

[[durable_objects.bindings]]
name = "LIMITER"
class_name = "Limiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Limiter"]

# Gizli açarlar fayla YAZILMIR, əmrlə əlavə olunur:
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put IP_SALT      (istənilən uzun təsadüfi mətn)
